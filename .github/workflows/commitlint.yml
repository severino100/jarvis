# Cada commit de um PR tem de seguir Conventional Commits (o mesmo critério do hook commit-msg em .githooks).
# O título do PR, que é o que decide a versão do release, é validado em pr-title.yml.
name: commitlint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar as mensagens dos commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          falhou=0
          while IFS= read -r linha; do
            sha=${linha%% *}; msg=${linha#* }
            case "$msg" in Merge\ *|Revert\ *|fixup!\ *|squash!\ *) continue ;; esac
            if ! printf '%s' "$msg" | grep -Eq '^(feat|fix|perf|refactor|chore|docs|ci|test|style|build)(\([^)]+\))?!?: .+'; then
              echo "::error::Commit ${sha:0:7} inválido: \"$msg\". Usa Conventional Commits, ex.: 'feat: botão novo'."
              falhou=1
            fi
          done < <(git log --no-merges --format='%H %s' "$BASE..$HEAD")
          exit $falhou
