# A tag v* (ex.: v0.2.0) compila o Jarvis no Windows e publica um release com o Jarvis-Setup.exe (o instalador que
# se passa às pessoas), o jarvis.exe e o install.ps1 (que descarrega o jarvis.exe do release).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do release (ex.: v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Compilar
        working-directory: native
        run: cargo build --release --locked

      - name: Instalador (Jarvis-Setup.exe)
        run: |
          choco upgrade innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q installer\jarvis.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Publicar o release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Jarvis ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            installer/Output/Jarvis-Setup.exe
            native/target/release/jarvis.exe
            scripts/install.ps1
