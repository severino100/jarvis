[package]
name = "jarvis"
version = "0.1.6"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "accesskit", "clipboard", "links"] }
global-hotkey = "0.10.0"
hound = "3.5.1"
image = { version = "0.25.10", default-features = false, features = ["ico", "png", "jpeg"] }
regex = "1.13.1"
rfd = "0.18.0"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "recording", "wav", "mp3", "flac"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.4", default-features = false, features = ["system", "disk"] }
tauri-winrt-notification = "0.8.1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tray-icon = "0.26.1"
ureq = { version = "3.5.2", features = ["json"] }
windows = { version = "0.62.2", features = ["Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_System_WinRT"] }
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[build-dependencies]
winresource = "0.1.34"
